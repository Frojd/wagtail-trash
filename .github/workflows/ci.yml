name: CI

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  UV_SYSTEM_PYTHON: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        wagtail-version: ["7.4.4", "8.0.1", "8.1"]
        django-version: ["5.2", "6.0", "6.1"]
        exclude:
          - python-version: "3.11"
            django-version: "6.0"
          - python-version: "3.11"
            django-version: "6.1"
          - wagtail-version: "7.4.4"
            django-version: "6.1"
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install uv
      run: python -m pip install --require-hashes -r requirements/uv.txt
    - name: Install dependencies
      run: uv pip install ".[testing]" "wagtail==${{ matrix.wagtail-version }}" "Django==${{ matrix.django-version }}.*"
    - name: Run tests
      run: python runtests.py
    - name: Run tests with wagtail-modeladmin
      run: python runtests.py
      env:
        DJANGO_SETTINGS_MODULE: tests.app.settings_with_wagtail_modeladmin

  test-lowest:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.11"
    - name: Install uv
      run: python -m pip install --require-hashes -r requirements/uv.txt
    - name: Install lowest declared dependencies
      run: uv pip install --resolution lowest-direct ".[testing]"
    - name: Run tests
      run: python runtests.py
    - name: Run tests with wagtail-modeladmin
      run: python runtests.py
      env:
        DJANGO_SETTINGS_MODULE: tests.app.settings_with_wagtail_modeladmin

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install --require-hashes -r requirements/uv.txt
      - name: Install lint tools
        run: uv sync --frozen --only-group lint
      - name: Run black
        run: uv run --frozen --no-sync black --check --verbose --extend-exclude=migrations .
      - name: Run isort
        run: uv run --frozen --no-sync isort . --check-only

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          scan-type: fs
          scan-ref: .
          trivy-config: trivy.yaml
          scanners: vuln,misconfig,secret
          severity: CRITICAL,HIGH
          exit-code: "1"
          format: table

  security-actions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install --require-hashes -r requirements/uv.txt
      - name: Install zizmor
        run: uv sync --frozen --only-group lint
      - name: Audit GitHub Actions workflows
        run: uv run --frozen --no-sync zizmor --config zizmor.yml --format github .github/workflows
        env:
          GH_TOKEN: ${{ github.token }}

  deploy:
    needs: [lint, test, test-lowest, security, security-actions]
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/testv')
    uses: $/.github/workflows/deploy.yml
    secrets:
      PYPI_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
      TEST_PYPI_PASSWORD: ${{ secrets.TEST_PYPI_PASSWORD }}
