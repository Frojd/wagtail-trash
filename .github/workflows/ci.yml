name: Run tests, lint and publish

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  UV_SYSTEM_PYTHON: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        wagtail-version: ["7.4.4", "8.0.1", "8.1"]
        django-version: ["5.2", "6.0", "6.1"]
        exclude:
          - python-version: "3.11"
            django-version: "6.0"
          - python-version: "3.11"
            django-version: "6.1"
          - wagtail-version: "7.4.4"
            django-version: "6.1"
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install uv
      run: python -m pip install --require-hashes -r requirements/uv.txt
    - name: Install dependencies
      run: uv pip install ".[testing]" "wagtail==${{ matrix.wagtail-version }}" "Django==${{ matrix.django-version }}.*"
    - name: Run tests
      run: python runtests.py
    - name: Run tests with wagtail-modeladmin
      run: python runtests.py
      env:
        DJANGO_SETTINGS_MODULE: tests.app.settings_with_wagtail_modeladmin

  test-lowest:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.11"
    - name: Install uv
      run: python -m pip install --require-hashes -r requirements/uv.txt
    - name: Install lowest declared dependencies
      run: uv pip install --resolution lowest-direct ".[testing]"
    - name: Run tests
      run: python runtests.py
    - name: Run tests with wagtail-modeladmin
      run: python runtests.py
      env:
        DJANGO_SETTINGS_MODULE: tests.app.settings_with_wagtail_modeladmin

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install --require-hashes -r requirements/uv.txt
      - name: Install lint tools
        run: uv sync --frozen --only-group lint
      - name: Run black
        run: uv run --frozen --no-sync black --check --verbose --extend-exclude=migrations .
      - name: Run isort
        run: uv run --frozen --no-sync isort . --check-only
      - name: Run zizmor
        run: uv run --frozen --no-sync zizmor --format github .github/workflows
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    runs-on: ubuntu-latest
    needs: [test, test-lowest, lint]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install --require-hashes -r requirements/uv.txt
      - name: Build
        run: uv build --build-constraints requirements/build-constraints.txt --require-hashes
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/testv')
    environment: testpypi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install --require-hashes -r requirements/uv.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Release to Test PyPi
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.TEST_PYPI_PASSWORD }}
        run: uv publish --publish-url https://test.pypi.org/legacy/ dist/* # zizmor: ignore[use-trusted-publishing]

  publish-pypi:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install --require-hashes -r requirements/uv.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Release to PyPi
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_PASSWORD }}
        run: uv publish dist/* # zizmor: ignore[use-trusted-publishing]
